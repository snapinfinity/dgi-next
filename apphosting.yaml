# Firebase App Hosting config. See https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# NEXT_PUBLIC_* values are inlined into the client bundle at build time,
# so they must be available to the BUILD step. Firebase web config is public by design.
env:
  - variable: NEXT_PUBLIC_BASE_URL
    value: https://www.decographinteriors.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBzPUJ16yJKbPW8RgUO_USqpbj3Oi5QEQo"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "dginteriors-a4435.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "dginteriors-a4435"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "dginteriors-a4435.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "90089629822"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "G-GF7MMFN950"
    availability: [BUILD, RUNTIME]
